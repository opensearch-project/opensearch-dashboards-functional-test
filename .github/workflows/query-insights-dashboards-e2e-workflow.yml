name: Query Insights Dashboards Release tests workflow in Bundled OpenSearch Dashboards
on:
  pull_request:
    branches: [ '**' ]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
    - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
      id: filter
      with:
        filters: |
          tests:
            - 'cypress/**/query-insights-dashboards/**'
            - '.github/workflows/release-e2e-workflow-template.yml'
            - '.github/workflows/query-insights-dashboards-e2e-workflow.yml'
            - 'scripts/query-insights/**'

  tests:
    needs: changes
    if: ${{ needs.changes.outputs.tests == 'true' }}
    uses: ./.github/workflows/release-e2e-workflow-template.yml
    with:
      test-name: Query Insights Dashboards
      test-command: bash scripts/query-insights/run-tests.sh

  # The release integ tests run every QI spec both with and without security, and the plugin
  # renders different columns depending on whether the security plugin is available.
  tests-without-security:
    needs: changes
    if: ${{ needs.changes.outputs.tests == 'true' }}
    uses: ./.github/workflows/release-e2e-workflow-template.yml
    with:
      test-name: Query Insights Dashboards without security
      test-command: bash scripts/query-insights/run-tests.sh
      security-enabled: false
      artifact-name-suffix: '-without-security'
